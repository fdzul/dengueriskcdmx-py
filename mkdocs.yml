site_name: dengueriskcdmx
site_description: Data and rasters for the dengue transmission risk map of the Mexico City Metropolitan Area (Python version of the R package dengueriskcdmx).
site_author: Felipe Antonio Dzul Manzanilla
site_url: https://fdzul.github.io/dengueriskcdmx-py

repo_name: fdzul/dengueriskcdmx-py
repo_url: https://github.com/fdzul/dengueriskcdmx-py

copyright: Copyright © 2026 Dzul Manzanilla, Correa-Morales, Huerta, Mejía-Guevara, Gómez-Dantés

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.magiclink
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fdzul/dengueriskcdmx-py
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/dengueriskcdmx/
    - icon: fontawesome/brands/r-project
      link: https://fdzul.github.io/dengueriskcdmx/

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: quickstart.md
  - Data:
      - Overview: datasets.md
  - Citation:
      - How to Cite: citation.md
  - License:
      - MIT License: license.md
